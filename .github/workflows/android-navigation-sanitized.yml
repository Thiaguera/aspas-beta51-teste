name: Android navigation demo (sanitized)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    name: Build and navigate offline demo
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore sanitized sources
        shell: bash
        run: |
          set -euo pipefail
          node tools/restore-sources.cjs
          # Remove the remaining abbreviated personal-looking demo label only in this ephemeral runner.
          # This does not modify the repository, production sources, or any artifact.
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('app/src/main/assets').glob('*'):
              if p.is_file() and p.suffix in {'.js', '.html'}:
                  p.write_text(p.read_text().replace('Usuário demonstrativo 1 V. Pereira', 'Usuário demonstrativo 1'), encoding='utf-8')
          PY
          # A fresh random numeric PIN exists only in this job; it is never echoed, committed or uploaded.
          ASPAS_DEMO_PIN="$(shuf -i 100000-999999 -n 1)"
          echo "ASPAS_DEMO_PIN=$ASPAS_DEMO_PIN" >> "$GITHUB_ENV"
          export ASPAS_DEMO_PIN
          node tools/configure-demo.cjs >/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK locally
        run: gradle --no-daemon assembleDebug

      - name: Run offline navigation on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p evidence
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell am force-stop br.com.aspas.contingencia.beta51test
            adb shell monkey -p br.com.aspas.contingencia.beta51test 1 >/dev/null
            sleep 5
            adb exec-out screencap -p > evidence/01-login.png
            adb shell uiautomator dump /sdcard/login.xml >/dev/null
            adb pull /sdcard/login.xml evidence/01-login.xml >/dev/null
            # The demo profile is preselected. Type the job-only PIN without printing it.
            adb shell input tap 540 1040
            adb shell input text "$ASPAS_DEMO_PIN"
            adb shell input keyevent 66
            sleep 4
            adb exec-out screencap -p > evidence/02-mesas.png
            adb shell uiautomator dump /sdcard/mesas.xml >/dev/null
            adb pull /sdcard/mesas.xml evidence/02-mesas.xml >/dev/null
            # Navigation evidence only: no orders, payments, printing, sync, or configuration actions.
            adb shell input tap 165 1870
            sleep 2
            adb exec-out screencap -p > evidence/03-pedido.png
            adb shell input tap 538 1870
            sleep 2
            adb exec-out screencap -p > evidence/04-cozinha.png
            adb shell input tap 900 1870
            sleep 2
            adb exec-out screencap -p > evidence/05-config.png
            test -s evidence/01-login.png
            test -s evidence/02-mesas.png
            test -s evidence/03-pedido.png
            test -s evidence/04-cozinha.png
            test -s evidence/05-config.png

      - name: Upload redacted navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-navigation-evidence
          path: evidence/*.png
          if-no-files-found: warn
          retention-days: 7
